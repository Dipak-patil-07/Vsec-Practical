<!DOCTYPE html>
<html>
<head>
    <title>Student Record</title>
     <link rel="stylesheet" href="studrecord.css">
</head>

<body>

<div class="container">

<h1>Student Record</h1>

<input type="text" id="name" placeholder="Enter Name"><br>

<input type="number" id="sub1" placeholder="Subject 1 Marks"><br>

<input type="number" id="sub2" placeholder="Subject 2 Marks"><br>

<input type="number" id="sub3" placeholder="Subject 3 Marks"><br>

<button onclick="addStudent()">Add Record</button>

</div>

<table id="studentTable">

<tr>
    <th>Name</th>
    <th>Subject 1</th>
    <th>Subject 2</th>
    <th>Subject 3</th>
    <th>Total</th>
    <th>Percentage</th>
</tr>

</table>

<h2 id="topper">Topper : </h2>

<script src="studrecord.js">
</script>

</body>
</html>
