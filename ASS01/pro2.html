<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pro2.css">
    <title>Four Box Animation</title>
</head>

<body>

    <div class="main">

        <div class="center">
            <span><h1>Hello</h1></span>
        </div>

        <div class="row1">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="row2">
            <div class="box3"></div>
            <div class="box4"></div>
        </div>

    </div>

    <script>
        const center = document.querySelector(".center");

        center.addEventListener("mouseenter", function()
        {
            document.querySelector(".main").classList.add("active");

            setTimeout(function()
            {
                document.querySelector(".main").classList.remove("active");
            }, 2000);
        });
    </script>

</body>
</html>
